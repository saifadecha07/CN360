# coturn 4.18 — TURN relay for VEIL viewers whose network blocks direct WebRTC (UDP/TCP 8189).
#
# Site-specific values come from docker-compose.yml command-line flags (deployment/.env):
#   --realm, --static-auth-secret, --external-ip, --allowed-peer-ip
#
# Ports: 3478/udp + 3478/tcp (TURN), 49160-49200/udp (relay range). TURN-over-TLS (5349)
# is not enabled: media inside TURN is already DTLS-SRTP encrypted and credentials are
# time-limited HMACs, so TLS would only help on networks that allow nothing but TLS.

listening-port=3478
min-port=49160
max-port=49200

# REST-API style auth: MediaMTX (webrtcICEServers2 username AUTH_SECRET) hands each viewer
# a "<expiry>:<id>" username + HMAC password derived from the shared secret.
use-auth-secret
fingerprint

# Only relay to the media server itself. Without this a TURN server is an open proxy
# into any address it can reach. --allowed-peer-ip (the VPS public IP) overrides the denial.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers

# Abuse limits (allocations): per user and total.
user-quota=12
total-quota=200
stale-nonce=600

no-tls
no-dtls
no-software-attribute
log-file=stdout
simple-log
